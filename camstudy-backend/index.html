<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠스터디 라이브 룸</title>
    
    <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #2c3e50; color: #333; padding: 40px 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #1a252f; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; }
        input { width: 100%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background-color: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: bold; }
        button:hover { background-color: #c0392b; }
        .status { margin-top: 15px; padding: 10px; background: #ecf0f1; border-radius: 6px; text-align: center; font-weight: bold; color: #7f8c8d; }
        #video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 25px; }
        video { width: 100%; background: #000; border-radius: 8px; transform: rotateY(180deg); }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 캠스터디 룸 입장</h2>
    <div class="form-group">
        <label for="roomName">방 이름 (Room Name)</label>
        <input type="text" id="roomName" value="test-room">
    </div>
    <div class="form-group">
        <label for="userName">닉네임 (User Name)</label>
        <input type="text" id="userName" value="coding-king">
    </div>
    <button onclick="joinRoom()">스터디 참여하기</button>
    <div id="status" class="status">대기 중... 버튼을 눌러주세요.</div>

    <div id="video-grid"></div>
</div>

<script>
    async function joinRoom() {
        const roomName = document.getElementById('roomName').value;
        const userName = document.getElementById('userName').value;
        const statusDiv = document.getElementById('status');
        const videoGrid = document.getElementById('video-grid');

        if (!roomName || !userName) {
            alert('방 이름과 닉네임을 입력해 주세요.');
            return;
        }

        statusDiv.style.color = "#3498db";
        statusDiv.innerText = "1. 백엔드에서 토큰 가져오는 중...";

        try {
            // FastAPI 백엔드로 토큰 받아오기 요청
            const response = await fetch(`/api/get-token?room_name=${roomName}&user_name=${userName}`);
            if (!response.ok) throw new Error(`백엔드 토큰 발급 오류`);
            
            const data = await response.json();
            if (!data || !data.token) throw new Error("토큰 값이 비어있습니다.");

            const token = data.token;
            statusDiv.style.color = "#f39c12";
            statusDiv.innerText = "2. LiveKit 캠서버 연결 중...";

            // 💡 본인의 라이브키트 주소 (Dashboard 주소 확인)
            const LIVEKIT_URL = "wss://camstudy-pwhx3n89.livekit.cloud"; 

            // CDN이 스크립트를 로드해 생성한 글로벌 객체 주입 확인
            const LK = window.LiveKitClient || window.LiveKit;
            if (!LK) {
                throw new Error("LiveKit 라이브러리가 로드되지 않았습니다.");
            }

            // 룸 객체 초기화
            const room = new LK.Room();
            
            // 원격 참가자가 카메라를 켰을 때 비디오 화면을 브라우저에 부착하는 이벤트
            room.on(LK.RoomEvent.TrackSubscribed, (track) => {
                if (track.kind === "video") {
                    const videoElement = track.attach();
                    videoGrid.appendChild(videoElement);
                }
            });

            // LiveKit 서버 접속
            await room.connect(LIVEKIT_URL, token);
            statusDiv.style.color = "#2ecc71";
            statusDiv.innerText = "🎉 접속 성공! 카메라 권한을 수락해 주세요.";

            // 본인 디바이스 장치(웹캠, 마이크) 활성화
            await room.localParticipant.enableCameraAndMicrophone();

            // 내 캠 화면을 화면 그리드에 즉시 추가
            const localVideo = room.localParticipant.getTrackPublication(LK.TrackSource.Camera);
            if (localVideo && localVideo.videoTrack) {
                const videoElement = localVideo.videoTrack.attach();
                videoGrid.appendChild(videoElement);
            }

        } catch (error) {
            console.error(error);
            statusDiv.style.color = "#e74c3c";
            statusDiv.innerText = "오류 발생: " + error.message;
        }
    }
</script>
</body>
</html>
